[package]
name = "laserprep-vectorize"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Raster-to-SVG tracing behind a Vectorizer trait (see docs/adr/0003)."

[dependencies]
laserprep-quantize.workspace = true
thiserror.workspace = true
vtracer = "0.6"
# Same version vtracer 0.6 depends on: needed to read the raw polygon
# points vtracer::convert() returns in PathSimplifyMode::Polygon mode
# (see trace_polygons). Never re-exported outside this crate (ADR 0003).
visioncortex = "0.8"

[dev-dependencies]
laserprep-domain.workspace = true
