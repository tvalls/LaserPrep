name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to (re)build and publish assets for (e.g.
          laserprep-v0.2.0). Use this to retry after a failed asset
          upload without cutting a new version.
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-publish:
    name: Build and publish Windows artifacts
    needs: release-please
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: windows-latest
    env:
      # The tag whose GitHub Release gets the built assets: either the
      # tag release-please just cut (normal push-triggered release), or
      # a tag supplied manually via workflow_dispatch to retry a failed
      # asset upload without cutting a new version.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          # The Cargo workspace root (this repo root) is the shared
          # target directory for every workspace member including
          # src-tauri — not src-tauri/target — since src-tauri is a
          # workspace member, not a standalone crate root.
          $bundleDir = "target/release/bundle"
          $checksumFile = "SHA256SUMS.txt"
          Get-ChildItem -Path $bundleDir -Recurse -Include *.msi, *.exe |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File -Append -Encoding utf8 $checksumFile
            }

      - name: Generate updater manifest (latest.json)
        # CLAUDE.md Section 22: "verificação de integridade/assinatura
        # quando suportado" — tauri-plugin-updater's endpoint format.
        # Prefers the NSIS updater artifact over MSI's when both exist
        # (createUpdaterArtifacts signs each bundle target directly for
        # Windows — the installer itself, e.g. "...-setup.exe.sig" /
        # "....msi.sig" — there is no intermediate .zip archive here,
        # unlike macOS/Linux updater artifacts); NSIS supports the
        # plugin's silent update install path.
        shell: pwsh
        run: |
          $bundleDir = "target/release/bundle"
          $sigFile = Get-ChildItem -Path $bundleDir -Recurse -Filter "*setup.exe.sig" | Select-Object -First 1
          if (-not $sigFile) {
            $sigFile = Get-ChildItem -Path $bundleDir -Recurse -Filter "*.msi.sig" | Select-Object -First 1
          }
          if (-not $sigFile) {
            throw "No updater signature (.sig) file found under $bundleDir — is createUpdaterArtifacts enabled and the signing key configured?"
          }

          $archiveName = $sigFile.Name -replace '\.sig$', ''
          $signature = Get-Content -Path $sigFile.FullName -Raw
          $tag = "${{ env.RELEASE_TAG }}"
          # release-please-config.json sets package-name "laserprep", so
          # tags are "laserprep-vX.Y.Z", not a bare "vX.Y.Z" — strip the
          # package prefix, not just a leading "v", or tauri-plugin-updater
          # gets a non-SemVer "version" field it cannot compare.
          $version = $tag -replace '^laserprep-v', ''
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          $manifest = @{
            version   = $version
            notes     = "See the GitHub Release notes for $tag."
            pub_date  = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/$tag/$archiveName"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 -FilePath "latest.json"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $assets = Get-ChildItem -Path "target/release/bundle" -Recurse -Include *.msi, *.exe, *.zip, *.sig
          gh release upload $tag $assets.FullName SHA256SUMS.txt latest.json --clobber
