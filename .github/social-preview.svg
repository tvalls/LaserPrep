<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#2A2A2A"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  
  <g transform="translate(64, 56)">
    <svg width="44" height="44" viewBox="0 0 256 256">
      <circle cx="128" cy="60" r="6" fill="#E8E8E8"/>
      <line x1="128" y1="66" x2="90" y2="120" stroke="#FF6B35" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="128" y1="66" x2="166" y2="120" stroke="#FF6B35" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M 70 140 L 100 170 L 70 200 Z" fill="none" stroke="#E8E8E8" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M 156 140 L 186 170 L 156 200 Z" fill="none" stroke="#E8E8E8" stroke-width="2.4" stroke-linejoin="round"/>
      <rect x="113" y="145" width="6" height="50" fill="none" stroke="#858585" stroke-width="2.4" opacity="0.8"/>
      <rect x="128" y="145" width="6" height="50" fill="none" stroke="#858585" stroke-width="2.4" opacity="0.5"/>
      <rect x="143" y="145" width="6" height="50" fill="none" stroke="#858585" stroke-width="2.4" opacity="0.2"/>
    </svg>
    <text x="56" y="30" fill="#E8E8E8" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="28" letter-spacing="-0.4">LaserPrep</text>
  </g>

  
  <g transform="translate(0, 60)">
    <!-- Original photo -->
    <g transform="translate(240, 320)">
      <svg x="-90" y="-90" width="180" height="180" viewBox="0 0 150 150">
        <rect x="20" y="20" width="110" height="110" fill="none" stroke="#858585" stroke-width="2.5" rx="4"/>
        <circle cx="55" cy="50" r="12" fill="none" stroke="#858585" stroke-width="2.5"/>
        <path d="M 20 100 L 50 80 L 80 95 L 130 40" fill="none" stroke="#858585" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <text x="0" y="128" fill="#858585" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="20" text-anchor="middle">Original Photo</text>
    </g>

    <line x1="450" y1="320" x2="450" y2="440" stroke="#FF6B35" stroke-opacity="0.6" stroke-width="3" transform="translate(0,-100)"/>

    <!-- SVG tone layers -->
    <g transform="translate(640, 320)">
      <g transform="translate(-30, -50)">
        <rect x="0" y="20" width="20" height="100" fill="#FF6B35" opacity="0.9"/>
        <rect x="24" y="45" width="20" height="75" fill="#FF6B35" opacity="0.6"/>
        <rect x="48" y="65" width="20" height="55" fill="#FF6B35" opacity="0.3"/>
      </g>
      <text x="0" y="128" fill="#858585" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="20" text-anchor="middle">SVG Tone Layers</text>
    </g>

    <line x1="850" y1="320" x2="850" y2="440" stroke="#FF6B35" stroke-opacity="0.6" stroke-width="3" transform="translate(0,-100)"/>

    <!-- Engraved piece -->
    <g transform="translate(1040, 320)">
      <svg x="-90" y="-90" width="180" height="180" viewBox="0 0 150 150">
        <rect x="30" y="40" width="40" height="60" fill="none" stroke="#FF6B35" stroke-width="2.5"/>
        <rect x="80" y="50" width="40" height="50" fill="none" stroke="#FF6B35" stroke-width="2.5"/>
        <circle cx="75" cy="100" r="12" fill="none" stroke="#FF6B35" stroke-width="2.5"/>
      </svg>
      <text x="0" y="128" fill="#858585" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="20" text-anchor="middle">Engraved Piece</text>
    </g>
  </g>

  <text x="640" y="600" fill="#858585" font-family="'IBM Plex Mono', monospace" font-weight="400" font-size="16" text-anchor="middle">Open-source raster-to-SVG conversion for laser engraving</text>
</svg>
