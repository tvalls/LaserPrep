[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/domain",
    "crates/analysis",
    "crates/imaging",
    "crates/quantize",
    "crates/vectorize",
    "crates/optimize",
    "crates/svggen",
    "crates/presets",
    "crates/project",
    "crates/settings",
    "crates/pipeline",
    "crates/cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/tvalls/LaserPrep"
authors = ["LaserPrep contributors"]

[workspace.dependencies]
laserprep-domain = { path = "crates/domain" }
laserprep-analysis = { path = "crates/analysis" }
laserprep-imaging = { path = "crates/imaging" }
laserprep-quantize = { path = "crates/quantize" }
laserprep-vectorize = { path = "crates/vectorize" }
laserprep-optimize = { path = "crates/optimize" }
laserprep-svggen = { path = "crates/svggen" }
laserprep-presets = { path = "crates/presets" }
laserprep-project = { path = "crates/project" }
laserprep-settings = { path = "crates/settings" }
laserprep-pipeline = { path = "crates/pipeline" }

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
