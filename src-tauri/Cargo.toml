[package]
name = "laserprep"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "LaserPrep desktop application shell (Tauri)."

[lib]
name = "laserprep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"

laserprep-analysis.workspace = true
laserprep-imaging.workspace = true
laserprep-presets.workspace = true
laserprep-settings.workspace = true
laserprep-project.workspace = true
laserprep-pipeline.workspace = true

[dev-dependencies]
image.workspace = true
tempfile = "3"
